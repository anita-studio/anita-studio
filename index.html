<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Anita Studio</title><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#070b16;color:#f6f7fb}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#0b1020,#070b16)}header{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(7,11,22,.92);backdrop-filter:blur(14px);z-index:5}.brand{font-weight:800;font-size:22px}.brand span{color:#8b7cff}.badge{font-size:11px;padding:7px 10px;border-radius:999px;background:#19152d;color:#bdb4ff;border:1px solid #352d63}.screen{padding:18px 20px 100px}.hero{padding:26px 0 18px}.hero h1{font-size:38px;line-height:1.05;margin:0 0 10px}.hero p{color:#9ca4b8;margin:0;line-height:1.5}.card{background:#101626;border:1px solid #202a40;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 12px 35px rgba(0,0,0,.18)}label{display:block;font-size:13px;color:#b8bfd0;margin:0 0 8px}.field{margin-bottom:16px}input,textarea,select{width:100%;background:#0a0f1d;border:1px solid #29344d;color:#fff;border-radius:13px;padding:13px;outline:none}textarea{min-height:130px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(135deg,#8b7cff,#5e8cff);color:white;font-weight:800}.secondary{border:1px solid #303b56;background:#151c2d;color:#fff;border-radius:12px;padding:11px 13px}.ref{border:1px dashed #34415d;padding:18px;text-align:center;border-radius:14px;color:#929bb0}.hidden{display:none}.tabs{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(8,12,24,.96);border-top:1px solid #202a40;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:8}.tab{background:none;border:0;color:#7f899e;padding:8px 2px;font-size:11px}.tab.active{color:#fff}.tab b{display:block;font-size:19px;margin-bottom:3px}.progress{height:8px;background:#1d2638;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;width:28%;background:linear-gradient(90deg,#8b7cff,#5e8cff);border-radius:10px}.stage{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #202a40}.dot{width:12px;height:12px;border-radius:50%;background:#303b56}.done .dot{background:#63e6be}.activeStage .dot{background:#8b7cff;box-shadow:0 0 14px #8b7cff}.muted{color:#8e98ad;font-size:13px}.scene{display:flex;gap:12px}.num{min-width:38px;height:38px;border-radius:10px;background:#1a2140;display:grid;place-items:center;color:#a99fff;font-weight:800}.scene h3{margin:0 0 4px;font-size:15px}.scene p{margin:0;color:#8e98ad;font-size:13px;line-height:1.45}.topline{display:flex;justify-content:space-between;align-items:center}.pill{font-size:11px;padding:6px 8px;border-radius:999px;background:#16283a;color:#67d9ff}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:11px 15px;border-radius:12px;font-weight:700;display:none;z-index:20}.sectionTitle{font-size:21px;margin:8px 0}.small{font-size:12px;color:#7f899e}.menuCard{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid #202a40}.menuCard:last-child{border:0}.icon{width:42px;height:42px;border-radius:12px;background:#181f33;display:grid;place-items:center;margin-right:12px}.left{display:flex;align-items:center}.switch{width:44px;height:25px;border-radius:20px;background:#34415d;padding:3px}.switch i{display:block;width:19px;height:19px;border-radius:50%;background:#fff}.switch.on{background:#6f63e8}.switch.on i{margin-left:19px}
</style></head><body><div class="app"><header><div class="brand">✦ Anita <span>Studio</span></div><div class="badge">OWNER • PRO</div></header><main class="screen" id="content"></main><nav class="tabs"><button class="tab active" onclick="show('create',this)"><b>＋</b>Create</button><button class="tab" onclick="show('production',this)"><b>◉</b>Production</button><button class="tab" onclick="show('series',this)"><b>▣</b>Series</button><button class="tab" onclick="show('settings',this)"><b>⚙</b>Settings</button></nav></div><div class="toast" id="toast"></div><script>
const content=document.getElementById('content'),toast=document.getElementById('toast');let project=JSON.parse(localStorage.getItem('anitaProject')||'null');
function show(page,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');if(page==='create')create();if(page==='production')production();if(page==='series')series();if(page==='settings')settings()}
function create(){content.innerHTML=`<div class="hero"><h1>Create your anime.</h1><p>One idea in. Anita plans the story, characters, shots, sound and production.</p></div><div class="card"><div class="field"><label>Anime title</label><input id="title" placeholder="e.g. The Powerless One" value="${project?.title||''}"></div><div class="field"><label>Story prompt</label><textarea id="prompt" placeholder="Describe your anime idea, world, characters, conflict and tone...">${project?.prompt||''}</textarea></div><div class="field"><label>Reference images <span class="small">(optional)</span></label><div class="ref" onclick="document.getElementById('file').click()">＋ Add character, costume, location or inspiration</div><input id="file" class="hidden" type="file" accept="image/*" multiple></div><div class="row"><div class="field"><label>Episode</label><select id="ep"><option>Episode 1</option><option>Episode 2</option><option>Episode 3</option></select></div><div class="field"><label>Length</label><select id="length"><option>22 minutes</option><option>12 minutes</option><option>5 minutes</option></select></div></div><div class="row"><div class="field"><label>Audio</label><select><option>Japanese + English</option><option>Japanese only</option><option>English only</option></select></div><div class="field"><label>Quality</label><select><option>Cinema</option><option>High</option><option>Standard</option></select></div></div><button class="primary" onclick="startProduction()">✦ CREATE EPISODE</button></div><div class="card"><div class="topline"><b>AI Production Director</b><span class="pill">READY</span></div><p class="muted">Anita will create a production blueprint before expensive generation begins.</p></div>`}
function startProduction(){let title=document.getElementById('title').value.trim()||'Untitled Anime';let prompt=document.getElementById('prompt').value.trim()||'An original anime adventure with a powerless hero who discovers an unusual hidden ability.';project={title,prompt,progress:8,status:'Planning',created:new Date().toLocaleString()};localStorage.setItem('anitaProject',JSON.stringify(project));toast.textContent='Episode blueprint created';toast.style.display='block';setTimeout(()=>{toast.style.display='none';show('production');},900)}
function production(){if(!project){content.innerHTML='<div class="hero"><h1>No episode yet.</h1><p>Create your first episode to open the production dashboard.</p></div><button class="primary" onclick="show(\'create\')">Create Episode</button>';return}let stages=['Story & Script','Character Bible','World & Locations','Storyboard & Shots','Animation','Japanese Voice + Lip-sync','Music + SFX','English Dub / Subtitles','Quality Control','Final Episode'];let scenes=['Cold Open — The Night of the Fall','Aether Academy — Morning','The Classroom','The Rival — Kaito','The Aether Test','Team Five','Master Daigo','First Training','The Crystal','The Warning','The Unknown Observer'];content.innerHTML=`<div class="hero"><div class="topline"><div><h1>${project.title}</h1><p>Episode 1 • 22 min • Cinema</p></div><span class="pill">${project.status}</span></div></div><div class="card"><div class="topline"><b>Production progress</b><b>${project.progress}%</b></div><div class="progress"><i style="width:${project.progress}%"></i></div><p class="muted">Anita is preparing the production blueprint. This preview simulates the workflow.</p></div><div class="card"><b>Production Pipeline</b>${stages.map((s,i)=>`<div class="stage ${i<1?'done':''} ${i===1?'activeStage':''}"><span class="dot"></span><div><b>${s}</b><div class="muted">${i<1?'Completed':'Waiting for next production pass'}</div></div></div>`).join('')}</div><div class="card"><div class="topline"><b>Episode Blueprint</b><button class="secondary" onclick="toastMsg('Scene review opened')">Review</button></div>${scenes.map((s,i)=>`<div class="stage"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h3>${s}</h3><p>${i===0?'Cinematic opening, falling light, mystery and character setup.':'Scene timing, dialogue, camera shots, action and continuity planned by Anita.'}</p></div></div>`).join('')}</div><div class="row"><button class="secondary" onclick="toastMsg('Production paused')">Ⅱ Pause</button><button class="primary" onclick="toastMsg('Regeneration queued')">↻ Regenerate</button></div>`}
function series(){content.innerHTML=`<div class="hero"><h1>My Series</h1><p>Series Bible keeps characters, voices, locations and story continuity consistent.</p></div><div class="card"><div class="topline"><b>${project?.title||'Your Anime Series'}</b><span class="pill">SEASON 1</span></div><div class="menuCard"><div><b>Episode 1</b><div class="muted">The Powerless One • 22 min</div></div><span class="pill">PLANNED</span></div><div class="menuCard"><div><b>Character Bible</b><div class="muted">Appearance • personality • voice • powers</div></div>›</div><div class="menuCard"><div><b>World Bible</b><div class="muted">Locations • rules • factions • lore</div></div>›</div><div class="menuCard"><div><b>Music Bible</b><div class="muted">Themes • OP • ED • insert songs</div></div>›</div></div><div class="card"><b>YouTube Automation</b><p class="muted">Connect your channel later using secure Google authorization, then choose publication days and times.</p><button class="secondary" onclick="toastMsg('YouTube connection will be added in the backend stage')">Connect YouTube</button></div>`}
function settings(){content.innerHTML=`<div class="hero"><h1>Settings</h1><p>Your Anita Studio control center.</p></div><div class="card"><div class="menuCard"><div class="left"><div class="icon">♛</div><div><b>Owner account</b><div class="muted">All Anita features unlocked</div></div></div><span class="pill">PRO</span></div><div class="menuCard"><div class="left"><div class="icon">♫</div><div><b>AI Music & Sound Director</b><div class="muted">Automatic music, ambience and SFX</div></div></div><div class="switch on"><i></i></div></div><div class="menuCard"><div class="left"><div class="icon">✓</div><div><b>AI Quality Director</b><div class="muted">Continuity, lip-sync and artifact checks</div></div></div><div class="switch on"><i></i></div></div><div class="menuCard"><div class="left"><div class="icon">◉</div><div><b>Live production preview</b><div class="muted">Review scenes while production runs</div></div></div><div class="switch on"><i></i></div></div></div>`}
function toastMsg(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1500)}
create();
</script></body></html>
